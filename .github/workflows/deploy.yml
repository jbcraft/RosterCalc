name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ main ] # Change to master if applicable

# Grant permissions needed to publish natively without a PAT
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' # Use your targeted .NET version

      - name: Publish Blazor Project
        run: dotnet publish RosterCalculator.csproj -c Release -o release --nologo

      # GitHub Pages subdirectories require the base href to match the repo name
      - name: Rewrite base href
        run: sed -i 's/<base href="\/" \/>/<base href="\/RosterCalc\/" \/>/g' release/wwwroot/index.html

      # Avoid 404s when users refresh a Blazor page directly
      - name: Copy index to 404
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      # Required to serve Blazor files starting with underscores (e.g. _framework)
      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
